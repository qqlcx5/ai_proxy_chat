[project]
name = "chat-online-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic-ai[openai]>=0.0.14",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["gateway.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
