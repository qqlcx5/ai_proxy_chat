<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 模型在线检测工具</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🔍 API 模型在线检测工具</h1>
        <p class="subtitle">并发检测多个 AI 模型是否在线</p>

        <!-- 配置区域 -->
        <div class="config-section">
            <div class="form-group">
                <label for="apiEndpoint">API 端点:</label>
                <input type="text" id="apiEndpoint" value="https://gptgod.cloud/v1/chat/completions" placeholder="API Endpoint">
            </div>
            <div class="form-group">
                <label for="apiKey">API Key:</label>
                <div class="input-group">
                    <input type="password" id="apiKey" placeholder="输入 API Key">
                    <button id="toggleApiKey" class="btn-icon">👁️</button>
                </div>
            </div>
            <div class="form-group">
                <label for="testMessage">测试消息:</label>
                <input type="text" id="testMessage" value="Hello!" placeholder="Test message">
            </div>
            <div class="form-group">
                <label for="timeout">超时时间 (秒):</label>
                <input type="number" id="timeout" value="30" min="5" max="120">
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="button-group">
            <button id="selectAll" class="btn btn-secondary">全选</button>
            <button id="deselectAll" class="btn btn-secondary">取消全选</button>
            <button id="selectTokenBilling" class="btn btn-secondary">选择 Token 计费</button>
            <button id="checkOnline" class="btn btn-primary">🚀 并发检测选中</button>
            <button id="clearResults" class="btn btn-danger">清空结果</button>
        </div>

        <!-- 模型选择 -->
        <div class="model-section">
            <h3>选择要检测的模型</h3>
            <div id="selectionInfo" class="selection-info">已选择 <strong>0</strong> 个模型</div>
            <select id="modelSelect" multiple class="model-select">
                <!-- 由 JS 动态生成 -->
            </select>
        </div>

        <!-- 加载提示 -->
        <div id="loadingOverlay" class="loading-overlay">
            <div class="loading-content">
                <div class="spinner"></div>
                <p id="loadingText">检测中...</p>
            </div>
        </div>

        <!-- 结果统计 -->
        <div class="summary-section">
            <div class="summary-item">
                <span class="summary-label">总检测数:</span>
                <span id="totalCount" class="summary-value">0</span>
            </div>
            <div class="summary-item success">
                <span class="summary-label">✅ 在线:</span>
                <span id="successCount" class="summary-value">0</span>
            </div>
            <div class="summary-item error">
                <span class="summary-label">❌ 离线:</span>
                <span id="errorCount" class="summary-value">0</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">💰 总积分:</span>
                <span id="pointsCount" class="summary-value">0</span>
            </div>
        </div>

        <!-- 结果列表 -->
        <div id="resultsList" class="results-list">
            <p class="no-results">暂无结果，请选择模型并点击"并发检测选中"</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
