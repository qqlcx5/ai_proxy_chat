<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星际躲避战</title>
<style>
/* ============================================================
 *  样式配置区
 *  全局布局、配色、动画均在此处定义
 * ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #020617, #0f172a 60%, #1e293b);
  font-family: "Segoe UI", Arial, "Microsoft YaHei", sans-serif;
  color: #fff;
  overflow: hidden;
}

/* 容器 */
.game-shell {
  width: min(94vw, 760px);
  text-align: center;
  user-select: none;
}

h1 {
  font-size: 32px;
  letter-spacing: 3px;
  margin-bottom: 6px;
  text-shadow: 0 0 24px rgba(56,189,248,0.5);
}

.sub {
  font-size: 13px;
  color: #94a3b8;
  margin-bottom: 14px;
  line-height: 1.8;
}

/* 道具说明 */
.legend {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.legend span {
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  background: rgba(30,41,59,0.8);
  border: 1px solid rgba(148,163,184,0.2);
}

/* 画布 */
canvas {
  display: block;
  margin: 0 auto;
  background: #020617;
  border: 3px solid #38bdf8;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(56,189,248,0.22);
  max-width: 100%;
  cursor: none;
}

/* 按钮栏 */
.btns {
  margin-top: 14px;
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}
.btns button {
  border: 0;
  border-radius: 999px;
  padding: 10px 22px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: transform .12s, background .12s;
}
.btns button:active { transform: scale(0.96); }
.btn-primary { background: #38bdf8; color: #020617; }
.btn-primary:hover { background: #7dd3fc; }
.btn-ghost { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
.btn-ghost:hover { background: #334155; }
</style>
</head>
<body>

<div class="game-shell">
  <h1>星际躲避战</h1>
  <div class="sub">
    WASD / 方向键移动 &nbsp;|&nbsp; 空格开始/暂停 &nbsp;|&nbsp; 鼠标可操控
  </div>
  <div class="legend">
    <span>🛡 护盾</span>
    <span>⚡ 加速</span>
    <span>❄ 减速</span>
    <span>💥 清屏</span>
    <span>❤ 续命</span>
  </div>

  <canvas id="game" width="720" height="440"></canvas>

  <div class="btns">
    <button class="btn-primary" id="btnStart">开始游戏</button>
    <button class="btn-ghost" id="btnPause">暂停</button>
    <button class="btn-ghost" id="btnRestart">重新开始</button>
  </div>
</div>

<script>
/* ============================================================
 *  游戏配置区
 *  所有可调参数集中在此，方便平衡性调整
 * ============================================================ */
const CFG = {
  /* 玩家 */
  playerSize: 28,
  playerSpeed: 280,
  playerMaxLives: 3,

  /* 敌人 */
  enemyBaseSpeed: 130,
  enemySpawnBase: 0.70,   // 秒
  enemySpawnMin: 0.14,    // 最快生成间隔
  difficultyK: 10000,     // 分母越大难度增长越慢

  /* 道具 */
  itemSpawnInterval: 3.4,
  itemSize: 28,
  itemSpeed: 130,

  /* 粒子 */
  particleLife: 0.9,

  /* 帧率保护 */
  maxDt: 0.033,

  /* 星空 */
  starCount: 100,
};

/* 道具类型定义：图标、颜色、持续时间(秒) */
const ITEMS = {
  shield: { icon: "🛡", color: "#22c55e", dur: 5  },
  speed:  { icon: "⚡", color: "#3b82f6", dur: 5  },
  slow:   { icon: "❄", color: "#06b6d4", dur: 6  },
  bomb:   { icon: "💥", color: "#a855f7", dur: 0  },
  heart:  { icon: "❤", color: "#f43f5e", dur: 0  },
};

/* ============================================================
 *  DOM 引用
 * ============================================================ */
const canvas  = document.getElementById("game");
const ctx     = canvas.getContext("2d");
const btnS    = document.getElementById("btnStart");
const btnP    = document.getElementById("btnPause");
const btnR    = document.getElementById("btnRestart");

/* ============================================================
 *  全局状态
 * ============================================================ */
let player, enemies, items, particles, stars;
let score, best, lives;
let running, paused, started;
let spawnTimer, itemTimer, lastTime;
let mouseX, mouseY, useMouse;

const keys = new Set();
best = Number(localStorage.getItem("starDodgeBest") || 0);

/* ============================================================
 *  工具函数
 * ============================================================ */
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function rectHit(a, bx, by, bs) {
  return a.x < bx + bs && a.x + a.size > bx &&
         a.y < by + bs && a.y + a.size > by;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* ============================================================
 *  音效系统 (Web Audio API, 无需外部文件)
 * ============================================================ */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq, dur, vol = 0.15, type = "square") {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}

function sfxItem()  { playTone(880, 0.12, 0.12); setTimeout(() => playTone(1100, 0.12, 0.10), 60); }
function sfxHit()   { playTone(220, 0.25, 0.18, "sawtooth"); }
function sfxDeath() { playTone(120, 0.5, 0.2, "sawtooth"); playTone(80, 0.6, 0.15, "sawtooth"); }
function sfxBomb()  { playTone(100, 0.4, 0.22, "triangle"); }

/* ============================================================
 *  初始化 / 重置
 * ============================================================ */
function createPlayer() {
  return {
    x: canvas.width / 2 - CFG.playerSize / 2,
    y: canvas.height - 60,
    size: CFG.playerSize,
    speed: CFG.playerSpeed,
    shield: 0,    // 护盾剩余时间
    speedUp: 0,   // 加速剩余时间
    slow: 0,      // 减速剩余时间
    lives: CFG.playerMaxLives,
    invincible: 0 // 受击后短暂无敌
  };
}

function createStars() {
  stars = Array.from({ length: CFG.starCount }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.6 + 0.4,
    sp: Math.random() * 35 + 10
  }));
}

function resetGame() {
  player     = createPlayer();
  enemies    = [];
  items      = [];
  particles  = [];
  score      = 0;
  spawnTimer = 0;
  itemTimer  = 0;
  running    = true;
  paused     = false;
  started    = true;
  useMouse   = false;
  lastTime   = performance.now();
  createStars();
}

/* ============================================================
 *  生成器：敌人、道具、粒子
 * ============================================================ */
function spawnEnemy() {
  const sz = 18 + Math.random() * 32;
  const diff = 1 + score / CFG.difficultyK;
  enemies.push({
    x: Math.random() * (canvas.width - sz),
    y: -sz - Math.random() * 60,
    size: sz,
    speed: (CFG.enemyBaseSpeed + Math.random() * 160) * diff,
    rot: Math.random() * Math.PI,
    rotSpd: Math.random() * 5 - 2.5
  });
}

function spawnItem() {
  const types = Object.keys(ITEMS);
  const type = types[Math.floor(Math.random() * types.length)];
  items.push({
    type,
    x: Math.random() * (canvas.width - CFG.itemSize),
    y: -CFG.itemSize,
    size: CFG.itemSize,
    speed: CFG.itemSpeed,
    pulse: 0
  });
}

function boom(x, y, color, n = 20) {
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 40 + Math.random() * 160;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: CFG.particleLife,
      color,
      r: 2 + Math.random() * 4
    });
  }
}

/* ============================================================
 *  道具效果执行
 * ============================================================ */
function applyItem(type) {
  const cfg = ITEMS[type];
  const cx = player.x + player.size / 2;
  const cy = player.y + player.size / 2;
  boom(cx, cy, cfg.color, 28);
  sfxItem();

  switch (type) {
    case "shield":
      player.shield = cfg.dur;
      break;
    case "speed":
      player.speedUp = cfg.dur;
      player.speed = CFG.playerSpeed * 1.7;
      break;
    case "slow":
      player.slow = cfg.dur;
      break;
    case "bomb":
      sfxBomb();
      enemies.forEach(e => boom(e.x + e.size / 2, e.y + e.size / 2, "#a855f7", 12));
      enemies = [];
      score += 300;
      break;
    case "heart":
      player.lives = Math.min(player.lives + 1, CFG.playerMaxLives + 2);
      break;
  }
}

/* ============================================================
 *  更新逻辑
 * ============================================================ */
function updatePlayer(dt) {
  // 鼠标优先
  if (useMouse && mouseX !== undefined) {
    player.x = clamp(mouseX - player.size / 2, 0, canvas.width - player.size);
    player.y = clamp(mouseY - player.size / 2, 0, canvas.height - player.size);
  } else {
    if (keys.has("ArrowLeft")  || keys.has("a") || keys.has("A")) player.x -= player.speed * dt;
    if (keys.has("ArrowRight") || keys.has("d") || keys.has("D")) player.x += player.speed * dt;
    if (keys.has("ArrowUp")    || keys.has("w") || keys.has("W")) player.y -= player.speed * dt;
    if (keys.has("ArrowDown")  || keys.has("s") || keys.has("S")) player.y += player.speed * dt;
    player.x = clamp(player.x, 0, canvas.width - player.size);
    player.y = clamp(player.y, 0, canvas.height - player.size);
  }

  // 倒计时
  player.shield    = Math.max(0, player.shield - dt);
  player.speedUp   = Math.max(0, player.speedUp - dt);
  player.slow      = Math.max(0, player.slow - dt);
  player.invincible = Math.max(0, player.invincible - dt);

  if (player.speedUp <= 0) player.speed = CFG.playerSpeed;
}

function updateEnemies(dt) {
  const factor = player.slow > 0 ? 0.38 : 1;
  for (const e of enemies) {
    e.y += e.speed * factor * dt;
    e.rot += e.rotSpd * dt;
  }
  enemies = enemies.filter(e => e.y < canvas.height + e.size);
}

function updateItems(dt) {
  for (const it of items) {
    it.y += it.speed * dt;
    it.pulse += dt * 5;
  }
  items = items.filter(it => it.y < canvas.height + it.size);
}

function updateParticles(dt) {
  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.95;
    p.vy *= 0.95;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
}

function updateStars(dt) {
  for (const s of stars) {
    s.y += s.sp * dt;
    if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
  }
}

function checkCollisions() {
  const px = player.x, py = player.y, ps = player.size;

  // 敌人碰撞
  for (const e of enemies) {
    if (!rectHit(player, e.x, e.y, e.size)) continue;

    if (player.shield > 0) {
      // 护盾吸收
      boom(e.x + e.size / 2, e.y + e.size / 2, "#facc15", 16);
      enemies = enemies.filter(en => en !== e);
      score += 80;
      sfxItem();
    } else if (player.invincible <= 0) {
      // 扣命
      player.lives--;
      player.invincible = 1.2;
      sfxHit();
      boom(px + ps / 2, py + ps / 2, "#ef4444", 30);

      if (player.lives <= 0) {
        endGame();
        return;
      }
    }
    break;
  }

  // 道具拾取
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if (rectHit(player, it.x, it.y, it.size)) {
      applyItem(it.type);
      items.splice(i, 1);
    }
  }
}

function endGame() {
  running = false;
  sfxDeath();
  boom(player.x + player.size / 2, player.y + player.size / 2, "#ef4444", 45);
  best = Math.max(best, Math.floor(score));
  localStorage.setItem("starDodgeBest", best);
}

function update(dt) {
  updateStars(dt);
  updatePlayer(dt);

  spawnTimer += dt;
  itemTimer  += dt;

  const interval = Math.max(CFG.enemySpawnMin, CFG.enemySpawnBase - score / CFG.difficultyK);
  if (spawnTimer >= interval) { spawnEnemy(); spawnTimer = 0; }
  if (itemTimer >= CFG.itemSpawnInterval) { spawnItem(); itemTimer = 0; }

  updateEnemies(dt);
  updateItems(dt);
  updateParticles(dt);
  checkCollisions();

  score += dt * 115;
}

/* ============================================================
 *  渲染：背景
 * ============================================================ */
function drawBg() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#020617";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#e0f2fe";
  for (const s of stars) {
    ctx.globalAlpha = 0.3 + Math.random() * 0.25;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ============================================================
 *  渲染：玩家
 * ============================================================ */
function drawPlayer() {
  const cx = player.x + player.size / 2;
  const cy = player.y + player.size / 2;

  // 受击闪烁
  if (player.invincible > 0 && Math.floor(player.invincible * 10) % 2 === 0) return;

  // 护盾光环
  if (player.shield > 0) {
    ctx.strokeStyle = "#facc15";
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.7 + Math.sin(Date.now() / 120) * 0.3;
    ctx.beginPath();
    ctx.arc(cx, cy, player.size * 0.95, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // 本体
  ctx.fillStyle = player.speedUp > 0 ? "#60a5fa" : "#22c55e";
  roundRect(player.x, player.y, player.size, player.size, 7);
  ctx.fill();

  // 图标
  ctx.fillStyle = "#052e16";
  ctx.font = "17px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("🚀", cx, cy);
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
}

/* ============================================================
 *  渲染：敌人
 * ============================================================ */
function drawEnemies() {
  for (const e of enemies) {
    ctx.save();
    ctx.translate(e.x + e.size / 2, e.y + e.size / 2);
    ctx.rotate(e.rot);

    ctx.fillStyle = "#ef4444";
    roundRect(-e.size / 2, -e.size / 2, e.size, e.size, 7);
    ctx.fill();

    // 陨石图标
    ctx.fillStyle = "#991b1b";
    const fs = Math.max(12, e.size * 0.5);
    ctx.font = fs + "px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("☄", 0, 0);

    ctx.restore();
  }
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
}

/* ============================================================
 *  渲染：道具
 * ============================================================ */
function drawItems() {
  for (const it of items) {
    const cfg = ITEMS[it.type];
    const p = Math.sin(it.pulse) * 3;
    const sz = it.size + p;

    // 外发光
    ctx.shadowColor = cfg.color;
    ctx.shadowBlur = 12;

    ctx.fillStyle = cfg.color;
    roundRect(it.x - p / 2, it.y - p / 2, sz, sz, 8);
    ctx.fill();

    ctx.shadowBlur = 0;

    ctx.fillStyle = "#fff";
    ctx.font = "18px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(cfg.icon, it.x + it.size / 2, it.y + it.size / 2);
  }
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
}

/* ============================================================
 *  渲染：粒子
 * ============================================================ */
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / CFG.particleLife, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ============================================================
 *  渲染：HUD (分数、生命、道具状态)
 * ============================================================ */
function drawHUD() {
  ctx.fillStyle = "#fff";
  ctx.font = "16px Arial";

  // 左上角信息
  ctx.fillText("分数 " + Math.floor(score), 16, 26);
  ctx.fillText("最高 " + best, 16, 48);
  ctx.fillText("难度 " + (1 + score / CFG.difficultyK).toFixed(1) + "x", 16, 70);

  // 生命心形
  ctx.font = "18px Arial";
  for (let i = 0; i < player.lives; i++) {
    ctx.fillText("❤", canvas.width - 28 - i * 26, 28);
  }

  // 道具状态条
  const barY = canvas.height - 20;
  let barX = 16;
  const barItems = [
    { icon: "🛡", val: player.shield, color: "#22c55e" },
    { icon: "⚡", val: player.speedUp, color: "#3b82f6" },
    { icon: "❄", val: player.slow, color: "#06b6d4" },
  ];
  ctx.font = "13px Arial";
  for (const bi of barItems) {
    const active = bi.val > 0;
    ctx.fillStyle = active ? bi.color + "cc" : "rgba(100,116,139,0.25)";
    roundRect(barX, barY - 18, 86, 24, 12);
    ctx.fill();

    ctx.fillStyle = "#fff";
    ctx.textBaseline = "middle";
    ctx.fillText(
      bi.icon + " " + (active ? bi.val.toFixed(1) + "s" : "--"),
      barX + 12, barY - 6
    );
    ctx.textBaseline = "alphabetic";
    barX += 94;
  }
}

/* ============================================================
 *  渲染：遮罩层（开始 / 暂停 / 结束）
 * ============================================================ */
function drawOverlay() {
  if (started && running && !paused) return;

  ctx.fillStyle = "rgba(2,6,23,0.78)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  if (!started) {
    ctx.font = "40px Arial";
    ctx.fillText("星际躲避战", cx, cy - 60);
    ctx.font = "16px Arial";
    ctx.fillStyle = "#94a3b8";
    ctx.fillText("键盘 WASD / 方向键 或 鼠标操控", cx, cy - 16);
    ctx.fillText("收集道具，躲避陨石，活到最后", cx, cy + 14);
    ctx.fillStyle = "#38bdf8";
    ctx.fillText("按空格或点击「开始游戏」", cx, cy + 50);
  } else if (paused) {
    ctx.font = "38px Arial";
    ctx.fillText("已暂停", cx, cy - 14);
    ctx.font = "16px Arial";
    ctx.fillStyle = "#94a3b8";
    ctx.fillText("按空格或 P 继续", cx, cy + 28);
  } else {
    ctx.font = "38px Arial";
    ctx.fillText("游戏结束", cx, cy - 50);
    ctx.font = "20px Arial";
    ctx.fillText("最终分数 " + Math.floor(score), cx, cy - 10);
    ctx.font = "16px Arial";
    ctx.fillStyle = "#94a3b8";
    ctx.fillText("最高分 " + best, cx, cy + 20);
    ctx.fillStyle = "#38bdf8";
    ctx.fillText("按空格或点击「重新开始」", cx, cy + 56);
  }

  ctx.textAlign = "left";
}

/* ============================================================
 *  渲染：合计
 * ============================================================ */
function render() {
  drawBg();
  if (started) {
    drawItems();
    drawEnemies();
    drawPlayer();
    drawParticles();
    drawHUD();
  }
  drawOverlay();
}

/* ============================================================
 *  主循环
 * ============================================================ */
function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, CFG.maxDt);
  lastTime = now;

  if (running && !paused) update(dt);
  render();

  if (running && !paused) requestAnimationFrame(loop);
}

/* ============================================================
 *  事件绑定：键盘
 * ============================================================ */
window.addEventListener("keydown", e => {
  keys.add(e.key);

  if (e.key === " " || e.code === "Space") {
    e.preventDefault();
    if (!started || !running) { resetGame(); requestAnimationFrame(loop); }
    else togglePause();
  }
  if (e.key === "p" || e.key === "P") togglePause();
  if (e.key === "r" || e.key === "R") { resetGame(); requestAnimationFrame(loop); }
});

window.addEventListener("keyup", e => keys.delete(e.key));

/* ============================================================
 *  事件绑定：鼠标
 * ============================================================ */
canvas.addEventListener("mousemove", e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  mouseX = (e.clientX - rect.left) * scaleX;
  mouseY = (e.clientY - rect.top) * scaleY;
  useMouse = true;
});

canvas.addEventListener("mouseleave", () => { useMouse = false; });

canvas.addEventListener("click", () => {
  audioCtx.resume();
  if (!started || !running) { resetGame(); requestAnimationFrame(loop); }
});

/* ============================================================
 *  事件绑定：触屏
 * ============================================================ */
canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  mouseX = (t.clientX - rect.left) * (canvas.width / rect.width);
  mouseY = (t.clientY - rect.top) * (canvas.height / rect.height);
  useMouse = true;
}, { passive: false });

canvas.addEventListener("touchend", () => { useMouse = false; });

/* ============================================================
 *  事件绑定：按钮
 * ============================================================ */
btnS.addEventListener("click", () => { audioCtx.resume(); resetGame(); requestAnimationFrame(loop); });
btnP.addEventListener("click", togglePause);
btnR.addEventListener("click", () => { resetGame(); requestAnimationFrame(loop); });

function togglePause() {
  if (!started || !running) return;
  paused = !paused;
  if (!paused) { lastTime = performance.now(); requestAnimationFrame(loop); }
  else render();
}

/* ============================================================
 *  启动：初始渲染
 * ============================================================ */
player = createPlayer();
createStars();
render();
</script>
</body>
</html>
